<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BNI-簡報進度追蹤</title>
<link rel="stylesheet" href="styles/base.css?v=20260609a">
</head>
<body>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text" id="loaderText">載入中...</div>
</div>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h1>🎤 簡報進度系統</h1>
    <p>請輸入您的姓名登入</p>
    <input type="text" id="nameInput" placeholder="輸入姓名" />
    <button class="btn" onclick="doLogin()">登入</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- ROLE SELECT -->
<div class="login-page" id="roleSelectPage" style="display:none;">
  <div class="login-box">
    <h1 style="font-size:20px;">請選擇登入身份</h1>
    <p id="roleSelectName" style="font-weight:700;color:#222;font-size:16px;margin-bottom:20px;"></p>
    <div style="display:flex;flex-direction:column;gap:12px;width:100%;">
      <button class="btn" onclick="enterApp('consultant')" style="background:#c0392b;">簡報顧問</button>
      <button class="btn" onclick="enterApp('speaker')" style="background:#555;">簡報講者</button>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appPage">
  <div class="header">
    <h2 id="headerTitle">簡報進度系統</h2>
    <div class="header-right">
      <span class="user-badge" id="userBadge"></span>
      <button class="settings-btn" id="refreshBtn" onclick="doRefresh()" style="display:none">更新</button>
      <button class="settings-btn" id="settingsBtn" onclick="showSettings()" style="display:none">設定</button>
      <button class="logout-btn" onclick="doLogout()">登出</button>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
</div>

<div class="success-toast" id="toast"></div>

<!-- REMINDER MODAL -->
<div class="detail-modal" id="reminderModal" onclick="if(event.target===this)closeReminderModal()">
  <div class="detail-modal-box">
    <div class="detail-modal-head" style="background:#c0392b;">
      <span style="font-size:16px;font-weight:700;color:white;">本週提醒文字</span>
      <button class="modal-close-btn" onclick="closeReminderModal()" style="background:rgba(255,255,255,0.25);color:white;">✕</button>
    </div>
    <div class="detail-modal-body" id="reminderModalBody"></div>
  </div>
</div>

<!-- USAGE MODAL -->
<div class="detail-modal" id="usageModal" onclick="if(event.target===this)closeUsageModal()">
  <div class="detail-modal-box">
    <div class="detail-modal-head" style="background:#c0392b;">
      <span style="font-size:16px;font-weight:700;color:white;">使用率</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button onclick="showUsageModal(true)" style="background:rgba(255,255,255,0.2);border:none;color:white;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;">更新</button>
        <button class="modal-close-btn" onclick="closeUsageModal()" style="background:rgba(255,255,255,0.25);color:white;">✕</button>
      </div>
    </div>
    <div class="detail-modal-body" id="usageModalBody"></div>
  </div>
</div>

<!-- ADMIN DETAIL MODAL -->
<div class="detail-modal" id="adminDetailModal" onclick="if(event.target===this)closeAdminModal()">
  <div class="detail-modal-box">
    <div class="detail-modal-head" id="adminModalHead"></div>
    <div class="detail-modal-body" id="adminModalBody"></div>
  </div>
</div>

<script src="src/core.js?v=20260609a"></script>
<script src="src/auth.js?v=20260504a"></script>
<script src="src/admin.js?v=20260504a"></script>
<script src="src/consultant.js?v=20260513w"></script>
<script src="src/cases.js?v=20260505a"></script>
<script src="src/date-picker.js?v=20260504a"></script>
<script src="src/settings.js?v=20260516b"></script>
<script src="src/slides.js?v=20260504a"></script>
<script src="src/reminders.js?v=20260504a"></script>
</body>
</html>
